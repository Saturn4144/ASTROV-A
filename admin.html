<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovia Yönetim</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">ASTROVIA ✦</a></header><main><small>YÖNETİM PANELİ</small><h1>Yeni Yazı Ekle</h1><p>Bu ilk test sürümünde kayıtlar bu cihazdaki tarayıcıya kaydedilir. Ortak, gerçek yayın sistemi için sonraki aşamada veritabanı bağlayacağız.</p><form id="f"><input id="t" required placeholder="Başlık"><select id="c"><option>Astronomi</option><option>Gezegenler</option><option>Gökyüzü Olayları</option><option>Ay</option><option>Astroloji</option><option>Tarot</option><option>Kahve Falı</option></select><input id="i" value="✨"><textarea id="s" required placeholder="Kısa açıklama"></textarea><button class="btn">Yayınla</button></form><p id="ok"></p></main><script>f.onsubmit=e=>{e.preventDefault();let a=JSON.parse(localStorage.getItem("astrovia_articles")||"[]");a.unshift([i.value,c.value,t.value,s.value]);localStorage.setItem("astrovia_articles",JSON.stringify(a));ok.textContent="Yazı kaydedildi. Ana sayfayı açıp görebilirsin.";f.reset();i.value="✨"}</script></body></html>
